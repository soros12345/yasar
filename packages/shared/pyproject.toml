[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-shared"
version = "0.1.0"
description = "RevenueOS shared foundation: structured configuration, logging, correlation IDs, DB, Valkey, Celery factory"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.3",
    "redis==8.1.0",
    "celery==5.6.3",
    "psycopg[binary]==3.3.6",
]

[tool.setuptools.packages.find]
where = ["src"]
