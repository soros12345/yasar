[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-money"
version = "0.1.0"
description = "RevenueOS exact money: Decimal-only values with ISO 4217 currency exponents (V1A-2)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
