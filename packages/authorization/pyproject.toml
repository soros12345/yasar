[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-authorization"
version = "0.1.0"
description = "RevenueOS authorization: Casbin (pycasbin) domain-scoped RBAC with PostgreSQL-backed policies (V1A-1)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy==2.1.3",
    "casbin==1.43.0",
]

[tool.setuptools.packages.find]
where = ["src"]
