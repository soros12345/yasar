[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-execution-controller"
version = "0.1.0"
description = "RevenueOS execution authority: enforced guard chain + capability-gated provider adapters (V1A-4)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy==2.1.3",
    "pydantic==2.13.5",
    "redis==8.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
