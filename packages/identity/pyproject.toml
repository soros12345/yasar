[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-identity"
version = "0.1.0"
description = "RevenueOS identity: tenants, users, sessions (V1A-1)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy==2.1.3",
    "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
where = ["src"]
