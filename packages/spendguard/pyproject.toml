[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-spendguard"
version = "0.1.0"
description = "RevenueOS SpendGuard: enforcement stubs, deny-by-default, UNVERIFIED (V1A-3)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
where = ["src"]
