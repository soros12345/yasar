[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-spendguard"
version = "0.1.0"
description = "RevenueOS SpendGuard: per-tenant spend budgets + deny-by-default evaluation (V1A-4)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy==2.1.3",
    "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
where = ["src"]
