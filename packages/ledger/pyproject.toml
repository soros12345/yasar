[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos-ledger"
version = "0.1.0"
description = "CanonicalFinancialLedger: append-only double-entry financial truth (V1A-2)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy==2.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
